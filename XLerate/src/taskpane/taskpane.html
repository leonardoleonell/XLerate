<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XLerate</title>
    <script
      type="text/javascript"
      src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"
    />
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
  </head>
  <body class="ms-Fabric">
    <section id="sideload-msg" class="app-shell">
      <h3>Please sideload the add-in to use XLerate actions.</h3>
    </section>

    <main id="app-body" class="app-shell" style="display: none">
      <div id="settings-workspace"></div>

      <section id="shortcut-manager" class="shortcut-manager">
        <h2>Keyboard shortcuts</h2>
        <p class="field-help">
          Type a combination such as Ctrl+Alt+Shift+K (letters, digits and arrow keys only). Leave a
          field empty to fall back to the default.
        </p>
        <table>
          <tbody id="shortcut-manager-rows"></tbody>
        </table>
        <div class="detail-toolbar">
          <button id="shortcut-manager-save" class="primary-btn" type="button">Save shortcuts</button>
          <button id="shortcut-manager-reset" class="secondary-btn" type="button">Reset to defaults</button>
        </div>
        <p id="shortcut-manager-status" class="field-help"></p>
      </section>

      <section class="status-strip" role="status" aria-live="polite">
        <strong><span class="status-dot" aria-hidden="true"></span>Status</strong>
        <p id="status-text">Ready.</p>
      </section>
    </main>
  </body>
</html>
